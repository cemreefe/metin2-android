# Physical phone, reaching the dev VM's m2dev server through bore.pub tunnels
# (see docs/PORTING_DIARY.md "Test bundles"). Works only while the VM is up.
m2.abi=arm64-v8a,x86_64
m2.serverMode=remote
m2.serverHost=bore.pub
m2.authPort=47100
m2.channelPort=47111
m2.dataUrl=http://bore.pub:47180/m2data-2.txt
m2.dataVersion=2
m2.versionName=tunnel
