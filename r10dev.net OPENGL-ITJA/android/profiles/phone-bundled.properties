# Physical phone, single APK with the client data inside (no download), reaching the
# dev VM's m2dev server through bore.pub tunnels. bore.pub is pinned by IP because
# some resolvers return a different host for it. Works only while the VM is up.
m2.abi=arm64-v8a,x86_64
m2.serverMode=remote
m2.serverHost=159.223.110.159
m2.authPort=47100
m2.channelPort=47111
m2.dataBundled=true
m2.dataUrl=
m2.dataVersion=2
m2.versionName=bundled
