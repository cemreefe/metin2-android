# Fully offline single APK: client data and the server pack are inside the APK and the
# db + auth + channel core run inside the app on 127.0.0.1. No network, no adb pushes.
# Build with M2_SERVER_PACK=<make-server-pack.sh out dir> tools/make_bundle.sh offline-bundled <build>.
m2.abi=arm64-v8a,x86_64
m2.serverMode=embedded
m2.serverHost=127.0.0.1
m2.authPort=11000
m2.channelPort=11011
m2.dataBundled=true
m2.dataUrl=
m2.dataVersion=3
m2.versionName=offline
# Separate app: installs next to the online client instead of over it.
m2.applicationIdSuffix=.offline
m2.appLabel=Metin2 Offline
